<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BALI INK HUB artist studio page with portfolio, services, pricing, reviews, policies, and marketplace booking service." />
    <meta name="theme-color" content="#070403" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png" />
    <title>Artist Studio | BALI INK HUB</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header" id="top">
      <div class="container nav">
        <a class="brand" href="index.html" aria-label="BALI INK HUB home">
          <img src="assets/images/logo.png" alt="BALI INK HUB logo" />
          <span><strong>BALI INK HUB</strong><small>BALI INK TATTO</small></span>
        </a>

        <button class="nav-toggle" type="button" data-nav-toggle aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>

        <nav class="nav-menu" data-nav-menu>
          <a href="index.html#categories">Categories</a>
          <a href="index.html#services">Services</a>
          <a href="index.html#artists">Artists</a>
          <button type="button" data-open-assistant>Customer Service</button>
          <a href="#studio-services">Studio Services</a>
          <a href="#studio-reviews">Reviews</a>
        </nav>

        <div class="nav-actions">
          <a class="ghost-btn" href="index.html#artists">Back</a>
          <button class="gold-btn" type="button" data-open-studio-booking>Booking Service</button>
        </div>
      </div>
    </header>

    <main data-studio-root>
      <section class="studio-loading container">Loading artist studio...</section>
    </main>

    <nav class="mobile-app-nav" aria-label="Mobile app navigation">
      <a href="index.html"><span>⌂</span>Home</a>
      <a href="index.html#categories"><span>▤</span>Category</a>
      <button class="nav-book" type="button" data-open-me><span>♙</span>Me</button>
      <a href="index.html#services"><span>✦</span>Service</a>
      <a href="index.html#artists"><span>◎</span>Artist</a>
    </nav>

    <dialog class="modal booking-modal" data-modal="studio-booking">
      <form method="dialog" class="modal-card booking-card booking-wizard" data-studio-booking-form>
        <button class="modal-close" type="button" value="close" aria-label="Close">&times;</button>
        <aside class="booking-sidebar">
          <h3>Service Details</h3>
          <div class="booking-service-mini" data-booking-mini></div>
          <h3>Bookings</h3>
          <ol data-booking-steps></ol>
        </aside>
        <section class="booking-workspace">
          <div>
            <span class="eyebrow">Booking service</span>
            <h2 data-booking-title>Location</h2>
          </div>
          <div data-booking-body></div>
          <footer class="booking-actions">
            <button class="ghost-btn" type="button" data-booking-prev>Previous</button>
            <button class="gold-btn" type="button" data-booking-next>Next</button>
            <button class="gold-btn hidden" value="submit" data-booking-submit>Confirm Booking</button>
          </footer>
        </section>
      </form>
    </dialog>

    <dialog class="modal" data-modal="me">
      <form method="dialog" class="modal-card me-card" data-me-form>
        <button class="modal-close" type="button" value="close" aria-label="Close">&times;</button>
        <span class="eyebrow">Account access</span>
        <h2>Sign in or sign up</h2>
        <div class="auth-switch">
          <button class="active" type="button" data-auth-mode="signin">Sign in</button>
          <button type="button" data-auth-mode="signup">Sign up</button>
        </div>
        <input name="email" type="email" required placeholder="Email address" />
        <input name="password" type="password" required placeholder="Password" />
        <button class="gold-btn" value="submit">Continue</button>
        <div class="dashboard-preview hidden" data-dashboard-preview></div>
      </form>
    </dialog>

    <div class="toast" data-toast></div>
    <script type="module" src="assets/js/studio.js"></script>
    <script type="module" src="assets/js/assistant.js"></script>
  </body>
</html>
